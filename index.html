<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro com máscaras</title>
  <style>
    :root {
      --fundo: #f4f5f7;
      --cartao: #fff;
      --texto: #1c1f24;
      --suave: #6b7280;
      --borda: #d6d9df;
      --destaque: #2f6fed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem 4rem;
      background: var(--fundo);
      color: var(--texto);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 56rem; margin: 0 auto; }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    .intro { margin: 0 0 2rem; color: var(--suave); }
    fieldset {
      margin: 0 0 1.25rem;
      padding: 1.25rem 1.5rem 1.5rem;
      border: 1px solid var(--borda);
      border-radius: 12px;
      background: var(--cartao);
    }
    legend {
      padding: 0 .5rem;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--destaque);
    }
    .grade {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
    }
    .campo.largo { grid-column: 1 / -1; }
    label {
      display: block;
      margin-bottom: .3rem;
      font-size: .82rem;
      font-weight: 600;
      color: var(--suave);
    }
    input, select {
      width: 100%;
      padding: .6rem .7rem;
      border: 1px solid var(--borda);
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font: inherit;
    }
    input:focus, select:focus {
      outline: 2px solid var(--destaque);
      outline-offset: 1px;
      border-color: var(--destaque);
    }
    .acoes { display: flex; gap: .75rem; align-items: center; }
    button {
      padding: .65rem 1.4rem;
      border: 0;
      border-radius: 8px;
      background: var(--destaque);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="reset"] { background: #e5e7eb; color: var(--texto); }
    pre {
      margin: 1rem 0 0;
      padding: 1rem;
      overflow-x: auto;
      border-radius: 8px;
      background: #111418;
      color: #e8edf3;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Cadastro completo</h1>
    <p class="intro">
      Todos os campos usam a mesma função de máscara — o padrão fica no atributo
      <code>data-mascara</code> (<code>9</code> = dígito, <code>A</code> = letra,
      <code>*</code> = letra ou dígito).
    </p>

    <form novalidate>
      <fieldset>
        <legend>Pessoa física</legend>
        <div class="grade">
          <div class="campo largo">
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" autocomplete="name" placeholder="Maria de Souza">
          </div>
          <div class="campo">
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00"
                   data-mascara="999.999.999-99">
          </div>
          <div class="campo">
            <label for="rg">RG</label>
            <input id="rg" name="rg" inputmode="numeric" placeholder="00.000.000-0"
                   data-mascara="99.999.999-9">
          </div>
          <div class="campo">
            <label for="nascimento">Data de nascimento</label>
            <input id="nascimento" name="nascimento" inputmode="numeric" placeholder="00/00/0000"
                   data-mascara="99/99/9999">
          </div>
          <div class="campo">
            <label for="sexo">Sexo</label>
            <select id="sexo" name="sexo">
              <option value="">Selecione</option>
              <option>Feminino</option>
              <option>Masculino</option>
              <option>Outro</option>
              <option>Prefiro não informar</option>
            </select>
          </div>
          <div class="campo">
            <label for="estadoCivil">Estado civil</label>
            <select id="estadoCivil" name="estadoCivil">
              <option value="">Selecione</option>
              <option>Solteiro(a)</option>
              <option>Casado(a)</option>
              <option>Divorciado(a)</option>
              <option>Viúvo(a)</option>
              <option>União estável</option>
            </select>
          </div>
          <div class="campo">
            <label for="renda">Renda mensal (R$)</label>
            <input id="renda" name="renda" inputmode="numeric" placeholder="0,00"
                   data-mascara="moeda">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Documentos</legend>
        <div class="grade">
          <div class="campo">
            <label for="cnh">CNH</label>
            <input id="cnh" name="cnh" inputmode="numeric" placeholder="00000000000"
                   data-mascara="99999999999">
          </div>
          <div class="campo">
            <label for="titulo">Título de eleitor</label>
            <input id="titulo" name="titulo" inputmode="numeric" placeholder="0000 0000 0000"
                   data-mascara="9999 9999 9999">
          </div>
          <div class="campo">
            <label for="pis">PIS / NIS</label>
            <input id="pis" name="pis" inputmode="numeric" placeholder="000.00000.00-0"
                   data-mascara="999.99999.99-9">
          </div>
          <div class="campo">
            <label for="cns">Cartão do SUS (CNS)</label>
            <input id="cns" name="cns" inputmode="numeric" placeholder="000 0000 0000 0000"
                   data-mascara="999 9999 9999 9999">
          </div>
          <div class="campo">
            <label for="passaporte">Passaporte</label>
            <input id="passaporte" name="passaporte" placeholder="AA000000"
                   data-mascara="AA999999">
          </div>
          <div class="campo largo">
            <label for="certidao">Certidão (matrícula de 32 dígitos)</label>
            <input id="certidao" name="certidao" inputmode="numeric"
                   placeholder="000000 00 00 0000 0 00000 000 0000000-00"
                   data-mascara="999999 99 99 9999 9 99999 999 9999999-99">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Contato</legend>
        <div class="grade">
          <div class="campo">
            <label for="telefone">Telefone (fixo ou celular)</label>
            <input id="telefone" name="telefone" inputmode="tel" placeholder="(00) 00000-0000"
                   data-mascara="(99) 9999-9999|(99) 99999-9999">
          </div>
          <div class="campo">
            <label for="ddi">Telefone internacional</label>
            <input id="ddi" name="ddi" inputmode="tel" placeholder="+00 (00) 00000-0000"
                   data-mascara="+99 (99) 99999-9999">
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email"
                   placeholder="maria@exemplo.com">
          </div>
          <div class="campo">
            <label for="site">Site</label>
            <input id="site" name="site" type="url" placeholder="https://exemplo.com">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>
        <div class="grade">
          <div class="campo">
            <label for="cep">CEP</label>
            <input id="cep" name="cep" inputmode="numeric" placeholder="00000-000"
                   autocomplete="postal-code" data-mascara="99999-999">
          </div>
          <div class="campo largo">
            <label for="logradouro">Logradouro</label>
            <input id="logradouro" name="logradouro" placeholder="Rua das Acácias">
          </div>
          <div class="campo">
            <label for="numero">Número</label>
            <input id="numero" name="numero" inputmode="numeric" placeholder="123"
                   data-mascara="99999">
          </div>
          <div class="campo">
            <label for="complemento">Complemento</label>
            <input id="complemento" name="complemento" placeholder="Apto 42">
          </div>
          <div class="campo">
            <label for="bairro">Bairro</label>
            <input id="bairro" name="bairro" placeholder="Centro">
          </div>
          <div class="campo">
            <label for="cidade">Cidade</label>
            <input id="cidade" name="cidade" placeholder="São Paulo">
          </div>
          <div class="campo">
            <label for="uf">UF</label>
            <input id="uf" name="uf" placeholder="SP" data-mascara="AA">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Empresa</legend>
        <div class="grade">
          <div class="campo">
            <label for="cnpj">CNPJ</label>
            <input id="cnpj" name="cnpj" inputmode="numeric" placeholder="00.000.000/0000-00"
                   data-mascara="99.999.999/9999-99">
          </div>
          <div class="campo">
            <label for="cpfCnpj">CPF ou CNPJ</label>
            <input id="cpfCnpj" name="cpfCnpj" inputmode="numeric" placeholder="aceita os dois"
                   data-mascara="999.999.999-99|99.999.999/9999-99">
          </div>
          <div class="campo">
            <label for="ie">Inscrição estadual</label>
            <input id="ie" name="ie" inputmode="numeric" placeholder="000.000.000.000"
                   data-mascara="999.999.999.999">
          </div>
          <div class="campo">
            <label for="cnae">CNAE</label>
            <input id="cnae" name="cnae" inputmode="numeric" placeholder="0000-0/00"
                   data-mascara="9999-9/99">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Pagamento</legend>
        <div class="grade">
          <div class="campo">
            <label for="cartao">Número do cartão</label>
            <input id="cartao" name="cartao" inputmode="numeric" placeholder="0000 0000 0000 0000"
                   autocomplete="cc-number" data-mascara="9999 9999 9999 9999">
          </div>
          <div class="campo">
            <label for="validade">Validade</label>
            <input id="validade" name="validade" inputmode="numeric" placeholder="MM/AA"
                   autocomplete="cc-exp" data-mascara="99/99">
          </div>
          <div class="campo">
            <label for="cvv">CVV</label>
            <input id="cvv" name="cvv" inputmode="numeric" placeholder="000"
                   autocomplete="cc-csc" data-mascara="999|9999">
          </div>
          <div class="campo">
            <label for="agencia">Agência</label>
            <input id="agencia" name="agencia" inputmode="numeric" placeholder="0000-0"
                   data-mascara="9999-9">
          </div>
          <div class="campo">
            <label for="conta">Conta</label>
            <input id="conta" name="conta" inputmode="numeric" placeholder="00000000-0"
                   data-mascara="99999999-9">
          </div>
          <div class="campo">
            <label for="valor">Valor (R$)</label>
            <input id="valor" name="valor" inputmode="numeric" placeholder="0,00"
                   data-mascara="moeda">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Veículo</legend>
        <div class="grade">
          <div class="campo">
            <label for="placa">Placa (antiga)</label>
            <input id="placa" name="placa" placeholder="ABC-0000" data-mascara="AAA-9999">
          </div>
          <div class="campo">
            <label for="placaMercosul">Placa (Mercosul)</label>
            <input id="placaMercosul" name="placaMercosul" placeholder="ABC0D00"
                   data-mascara="AAA9A99">
          </div>
          <div class="campo">
            <label for="renavam">Renavam</label>
            <input id="renavam" name="renavam" inputmode="numeric" placeholder="00000000000"
                   data-mascara="99999999999">
          </div>
          <div class="campo">
            <label for="chassi">Chassi</label>
            <input id="chassi" name="chassi" placeholder="0AA00AAA0AA000000"
                   data-mascara="*****************">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Outros</legend>
        <div class="grade">
          <div class="campo">
            <label for="processo">Processo judicial</label>
            <input id="processo" name="processo" inputmode="numeric"
                   placeholder="0000000-00.0000.0.00.0000"
                   data-mascara="9999999-99.9999.9.99.9999">
          </div>
          <div class="campo">
            <label for="hora">Hora</label>
            <input id="hora" name="hora" inputmode="numeric" placeholder="00:00"
                   data-mascara="99:99">
          </div>
          <div class="campo">
            <label for="dataHora">Data e hora</label>
            <input id="dataHora" name="dataHora" inputmode="numeric" placeholder="00/00/0000 00:00"
                   data-mascara="99/99/9999 99:99">
          </div>
          <div class="campo">
            <label for="ip">Endereço IP</label>
            <input id="ip" name="ip" inputmode="numeric" placeholder="000.000.000.000"
                   data-mascara="999.999.999.999">
          </div>
          <div class="campo">
            <label for="mac">Endereço MAC</label>
            <input id="mac" name="mac" placeholder="00:AA:00:BB:00:CC"
                   data-mascara="**:**:**:**:**:**">
          </div>
          <div class="campo">
            <label for="porcentagem">Porcentagem</label>
            <input id="porcentagem" name="porcentagem" inputmode="numeric" placeholder="000"
                   data-mascara="999">
          </div>
        </div>
      </fieldset>

      <div class="acoes">
        <button type="submit">Ver dados</button>
        <button type="reset">Limpar</button>
      </div>
      <pre id="saida" hidden></pre>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
